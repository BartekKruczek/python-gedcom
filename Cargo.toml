[package]
name = "gedcom-core"
version = "1.2.0"
edition = "2021"
rust-version = "1.74"
license = "GPL-2.0-or-later"
description = "Rust core for the python-gedcom package"
publish = false

[lib]
name = "_gedcom"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
memchr = "2.8.3"
parking_lot = "0.12"

[dependencies.pyo3]
version = "0.29"
features = ["abi3-py39"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
